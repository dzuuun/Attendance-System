<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Attendance — TapTrack</title>
    <link rel="stylesheet" href="/client/dashboard/style.css" />
    <link rel="stylesheet" href="/client/page-shell.css" />
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebarMount"></div>
      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">UNIVERSITY ENTRANCE</p>
            <h1>University entrance log</h1>
          </div>
          <div class="live-time">
            <span id="liveTime"></span><small id="liveDate"></small>
          </div>
        </header>
        <section>
          <div class="section-header">
            <p>Time In and Time Out scans recorded at university entrances.</p>
            <label>Academic period<select id="period"></select></label>
          </div>
          <article class="table-card">
            <div class="filter-row">
              <div class="search-box">
                <span class="material-symbols-rounded" aria-hidden="true"
                  >search</span
                ><input id="search" placeholder="Search name or ID" />
              </div>
              <select id="type">
                <option value="all">All people</option>
                <option>Student</option>
                <option>Employee</option></select
              ><button class="primary-button" id="exportBtn">Export</button>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>PERSON</th>
                    <th>ID NUMBER</th>
                    <th>TYPE</th>
                    <th>LOCATION</th>
                    <th>DATE</th>
                    <th>TIME</th>
                    <th>ACTION</th>
                  </tr>
                </thead>
                <tbody id="body"></tbody>
              </table>
            </div>
          </article>
        </section>
      </main>
    </div>
    <script src="/client/shared-ui.js"></script>
    <script src="/client/attendance/script.js"></script>
  </body>
</html>
