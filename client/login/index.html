<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in — TapTrack</title>
    <link rel="stylesheet" href="portal.css" />
  </head>
  <body class="auth-page">
    <aside class="auth-side">
      <a class="portal-brand" href="/"><i class="material-symbols-rounded">track_changes</i> TapTrack</a>
      <div class="auth-quote">
        <h1>Welcome back.</h1>
        <p>
          Manage attendance, maintain directories, and keep your organization
          moving.
        </p>
      </div>
      <small>SECURE ATTENDANCE TERMINAL</small>
    </aside>
    <main class="auth-form-wrap">
      <form class="auth-card" id="loginForm">
        <small>STAFF PORTAL</small>
        <h2>Sign in</h2>
        <p>Use your administrator or staff account.</p>
        <label
          >Username<input
            id="username"
            autocomplete="username"
            required
            autofocus /></label
        ><label
          >Password<input
            id="password"
            type="password"
            autocomplete="current-password"
            required /></label
        ><button class="button" type="submit">Sign in →</button>
        <div class="auth-divider" id="googleDivider" hidden>
          <span>OR</span>
        </div>
        <a
          class="google-signin"
          id="googleSignIn"
          href="/api/auth/google"
          hidden
          ><span class="google-mark">G</span><span>Sign in with Google</span></a
        >
        <div class="auth-error" id="authError"></div>
        <a class="back-link" href="/">← Back to landing page</a>
      </form>
    </main>
    <script src="auth.js"></script>
    <script src="/client/brand-ui.js?v=20260824-5" data-brand-ui></script>
  </body>
</html>
