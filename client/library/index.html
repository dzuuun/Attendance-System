<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Library — TapTrack</title>
    <link rel="stylesheet" href="/client/dashboard/style.css" />
    <link rel="stylesheet" href="/client/dashboard/events.css" />
    <link rel="stylesheet" href="/client/page-shell.css" />
  </head>
  <body class="attendance-page library-log-page">
    <div class="app-shell">
      <div id="sidebarMount"></div>
      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">LIBRARY SERVICES</p>
            <h1 id="pageTitle">Library entrance logs</h1>
          </div>
          <div class="live-time">
            <span id="liveTime"></span><small id="liveDate"></small>
          </div>
        </header>
        <section>
          <div class="section-header">
            <p id="pageDescription">
              Review every entrance recorded at the library.
            </p>
            <div class="event-actions">
              <label>Academic period<select id="period"></select></label>
            </div>
          </div>
          <article class="table-card">
            <div class="filter-row">
              <div class="attendance-filter-fields">
                <div class="attendance-date-filter">
                  <select id="dateMode" aria-label="Date filter mode">
                    <option value="day">One day</option>
                    <option value="range">Date range</option>
                    <option value="month">Month</option>
                    <option value="period" selected>
                      Entire academic period
                    </option>
                  </select>
                  <label id="dateFromField" hidden>
                    <span id="dateFromLabel">Date</span>
                    <input type="date" id="dateFrom" />
                  </label>
                  <label id="monthField" hidden>
                    <span>Month</span>
                    <input type="month" id="month" />
                  </label>
                  <label id="dateToField" hidden>
                    <span>To</span>
                    <input type="date" id="dateTo" />
                  </label>
                </div>
                <div class="search-box">
                  <span class="material-symbols-rounded" aria-hidden="true"
                    >search</span
                  ><input
                    id="search"
                    placeholder="Search name, ID, date, or location"
                  />
                </div>
                <select id="type" aria-label="Person type">
                  <option value="all">All people</option>
                  <option>Student</option>
                  <option>Employee</option>
                </select>
              </div>
              <button class="primary-button" id="exportBtn">Export</button>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>ID NUMBER</th>
                    <th>FULL NAME</th>
                    <th>TYPE</th>
                    <th>COURSE CODE</th>
                    <th>DEPARTMENT</th>
                    <th>DATE</th>
                    <th>TIME</th>
                  </tr>
                </thead>
                <tbody id="body"></tbody>
              </table>
            </div>
          </article>
        </section>
      </main>
    </div>
    <script src="/client/shared-ui.js"></script>
    <script src="/client/library/script.js"></script>
  </body>
</html>
