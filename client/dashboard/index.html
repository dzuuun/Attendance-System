<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Overview — TapTrack</title>
    <link rel="stylesheet" href="/client/dashboard/style.css" />
    <link rel="stylesheet" href="/client/dashboard/events.css" />
    <link rel="stylesheet" href="/client/page-shell.css" />
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebarMount"></div>
      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">ATTENDANCE SUMMARY</p>
            <h1>Overview</h1>
          </div>
          <div class="top-actions">
            <div class="live-time">
              <span id="liveTime"></span><small id="liveDate"></small>
            </div>
          </div>
        </header>
        <section class="page-content">
          <div class="hero-grid">
            <div class="stats-column">
              <article class="stat-card accent">
                <div class="stat-icon material-symbols-rounded">how_to_reg</div>
                <div>
                  <small>CURRENTLY INSIDE</small
                  ><strong id="presentCount">0</strong>
                  <p><span id="attendanceRate">0%</span> of registered</p>
                </div>
              </article>
              <article class="stat-card">
                <div class="stat-icon student material-symbols-rounded">
                  school
                </div>
                <div>
                  <small>STUDENTS</small><strong id="studentCount">0</strong>
                  <p><span id="studentsToday">0</span> logged in</p>
                </div>
              </article>
              <article class="stat-card">
                <div class="stat-icon employee material-symbols-rounded">
                  badge
                </div>
                <div>
                  <small>EMPLOYEES</small><strong id="employeeCount">0</strong>
                  <p><span id="employeesToday">0</span> logged in</p>
                </div>
              </article>
            </div>
          </div>
          <article class="table-card recent-card">
            <div class="table-toolbar">
              <div>
                <span class="section-kicker">ENTRANCE LOG</span>
                <h2>Today's university entrance</h2>
              </div>
              <a class="text-button" href="/attendance">View all →</a>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>PERSON</th>
                    <th>ID NUMBER</th>
                    <th>TYPE</th>
                    <th>TIME</th>
                    <th>ACTION</th>
                  </tr>
                </thead>
                <tbody id="recentBody"></tbody>
              </table>
            </div>
          </article>
        </section>
      </main>
    </div>
    <script src="/client/shared-ui.js"></script>
    <script src="/client/dashboard/script.js"></script>
  </body>
</html>
