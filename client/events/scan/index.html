<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Event attendance scanner — TapTrack</title>
    <link rel="stylesheet" href="/client/dashboard/style.css" />
    <link rel="stylesheet" href="/client/page-shell.css" />
    <link rel="stylesheet" href="/client/events/scan/style.css" />
    <link rel="stylesheet" href="/client/camera-scanner.css" />
  </head>

  <body>
    <div class="app-shell">
      <div id="sidebarMount"></div>
      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">EVENT</p>
            <h1 id="eventTitle">Attendance scanner</h1>
          </div>
        </header>
        <section class="event-scan-layout">
          <article class="event-scan-card">
            <div class="event-scan-heading">
              <div>
                <span class="section-kicker">ATTENDANT TERMINAL</span>
                <h2>Scan attendance</h2>
                <p id="eventDetails">Loading event information…</p>
              </div>
              <a class="secondary-button" href="/events">Back to events</a>
            </div>
            <fieldset class="action-selector">
              <legend>SCANS CURRENTLY ACCEPT</legend>
              <label
                ><input
                  type="radio"
                  name="scanAction"
                  value="Time In"
                  checked
                /><span
                  >Time In<small>Record arriving attendees</small></span
                ></label
              ><label
                ><input type="radio" name="scanAction" value="Time Out" /><span
                  >Time Out<small>Record departing attendees</small></span
                ></label
              >
            </fieldset>
            <form id="eventScanForm">
              <label for="eventScanInput">ID NUMBER</label>
              <div class="event-scan-input">
                <input
                  id="eventScanInput"
                  autocomplete="off"
                  placeholder="Tap card or enter ID…"
                  autofocus
                /><button class="primary-button">Record scan</button
                ><button
                  type="button"
                  class="camera-scan-button"
                  id="eventCameraScan"
                >
                  Use camera
                </button>
              </div>
            </form>
            <div
              class="event-scan-result"
              id="scanResult"
              role="status"
              aria-live="polite"
            >
              <strong>Ready to scan</strong
              ><span>Select Time In or Time Out, then scan an ID.</span>
            </div>
          </article>
          <article class="table-card">
            <div class="table-toolbar">
              <div>
                <span class="section-kicker">THIS EVENT</span>
                <h2>Attendance scans</h2>
              </div>
              <strong id="sessionCount">0 scans</strong>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>ATTENDEE</th>
                    <th>ID NUMBER</th>
                    <th>TYPE</th>
                    <th>ACTION</th>
                    <th>TIME</th>
                  </tr>
                </thead>
                <tbody id="scanBody"></tbody>
              </table>
            </div>
          </article>
        </section>
      </main>
    </div>
    <script src="/client/shared-ui.js"></script>
    <script src="/client/camera-scanner.js"></script>
    <script src="/client/events/scan/script.js"></script>
  </body>
</html>
