<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Academic Periods — TapTrack</title>
    <link rel="stylesheet" href="/client/dashboard/style.css" />
    <link rel="stylesheet" href="/client/dashboard/events.css" />
    <link rel="stylesheet" href="/client/page-shell.css" />
  </head>

  <body>
    <div class="app-shell">
      <div id="sidebarMount"></div>
      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Maintenance</p>
            <h1>Academic periods</h1>
          </div>
          <div class="live-time">
            <span id="liveTime"></span><small id="liveDate"></small>
          </div>
        </header>
        <div class="section-header">
          <p>
            Set the school year and term used for current attendance and events.
          </p>
          <button class="primary-button" id="addBtn">+ Add period</button>
        </div>
        <article class="table-card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>SCHOOL YEAR</th>
                  <th>TERM</th>
                  <th>STATUS</th>
                  <th>ACTIONS</th>
                </tr>
              </thead>
              <tbody id="body"></tbody>
            </table>
          </div>
        </article>
      </main>
    </div>
    <dialog id="dialog">
      <form id="form">
        <input type="hidden" id="recordId" />
        <div class="modal-head">
          <h2 id="dialogTitle">Add academic period</h2>
          <button class="close-button">×</button>
        </div>
        <div class="form-grid">
          <label
            >School year<input
              id="schoolYear"
              required
              placeholder="2026-2027"
              pattern="\d{4}-\d{4}" /></label
          ><label
            >Term<select id="term" required>
              <option>First Semester</option>
              <option>Second Semester</option>
              <option>Summer</option>
              <option>First Term</option>
              <option>Second Term</option>
              <option>Third Term</option>
            </select></label
          ><label class="full status-toggle-field"
            ><span
              ><strong>Current active period</strong
              ><small>Show and record data under this period</small></span
            ><input id="isCurrent" type="checkbox"
          /></label>
        </div>
        <p id="error" class="form-error"></p>
        <div class="modal-actions">
          <button value="cancel" class="secondary-button">Cancel</button
          ><button class="primary-button">Save period</button>
        </div>
      </form>
    </dialog>
    <script src="/client/shared-ui.js"></script>
    <script src="/client/maintenance/academic_period/script.js"></script>
  </body>
</html>
