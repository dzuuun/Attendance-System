<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Employees — TapTrack</title>
    <link rel="stylesheet" href="/client/dashboard/style.css" />
    <link rel="stylesheet" href="/client/dashboard/events.css" />
    <link rel="stylesheet" href="/client/page-shell.css" />
  </head>
  <body data-type="Employee">
    <div class="app-shell">
      <div id="sidebarMount"></div>
      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Maintenance</p>
            <h1>Employees</h1>
          </div>
          <div class="live-time">
            <span id="liveTime"></span><small id="liveDate"></small>
          </div>
        </header>
        <div class="section-header">
          <p>Manage employee information.</p>
          <div class="event-actions">
            <label class="directory-toggle" for="showInactive"><span>Show inactive</span><input id="showInactive" type="checkbox" /></label>
            <button class="secondary-button" id="bulkPhotoBtn" type="button">Upload photos</button>
            <button class="primary-button" id="addBtn">+ Add employee</button>
          </div>
        </div>
        <article class="table-card">
          <div class="filter-row">
            <div class="search-box">
              <span class="material-symbols-rounded" aria-hidden="true">search</span><input id="search" placeholder="Search employees" />
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID NUMBER</th>
                  <th>EMPLOYEE</th>
                  <th>DEPARTMENT</th>
                  <th>CONTACT</th>
                  <th>STATUS</th>
                  <th>ACTIONS</th>
                </tr>
              </thead>
              <tbody id="body"></tbody>
            </table>
          </div>
        </article>
      </main>
    </div>
    <dialog id="employeeLoadingDialog" class="satp-modal student-loading-modal" aria-labelledby="employeeLoadingTitle" aria-describedby="employeeLoadingMessage">
      <div class="student-loading-body">
        <span class="student-loading-spinner" aria-hidden="true"></span>
        <strong id="employeeLoadingTitle">Preparing employees</strong>
        <p id="employeeLoadingMessage">Starting the employee directory.</p>
      </div>
    </dialog>
    <dialog id="dialog">
      <form id="form">
        <div class="modal-head">
          <h2>Add employee</h2>
          <button class="close-button">×</button>
        </div>
        <div class="form-grid">
          <label>First name<input id="firstName" required /></label
          ><label>Middle name<input id="middleName" /></label
          ><label>Last name<input id="lastName" required /></label
          ><label>ID number<input id="idNumber" required /></label
          ><label>Department<select id="department" required><option value="">Select department</option></select></label
          ><label class="full">Contact<input id="contact" /></label>
          <div class="full record-photo-field">
            <span><strong>Employee photo (optional)</strong><small id="photoHelp">Choose a profile photo to upload when this employee is saved.</small></span>
            <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" />
          </div>
        </div>
        <p id="error" class="form-error"></p>
        <div class="modal-actions">
          <button value="cancel" class="secondary-button">Cancel</button
          ><button class="primary-button">Save</button>
        </div>
      </form>
    </dialog>
    <script src="/client/shared-ui.js"></script>
    <script src="/client/maintenance/directory.js"></script>
    <script src="/client/maintenance/import.js"></script>
    <script src="/client/person-log-export.js"></script>
    <script src="/client/profile-photo-upload.js"></script>
  </body>
</html>
