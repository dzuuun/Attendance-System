<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Employee Departments — TapTrack</title>
    <link rel="stylesheet" href="/client/dashboard/style.css" />
    <link rel="stylesheet" href="/client/dashboard/events.css" />
    <link rel="stylesheet" href="/client/page-shell.css" />
  </head>
  <body data-entity="employee_department" data-label="Employee departments">
    <div class="app-shell">
      <div id="sidebarMount"></div>
      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">EMPLOYEE DIRECTORY</p>
            <h1>Employee departments</h1>
          </div>
          <div class="live-time">
            <span id="liveTime"></span><small id="liveDate"></small>
          </div>
        </header>
        <div class="section-header">
          <p>Departments and offices available for employee records.</p>
          <div class="event-actions">
            <label class="directory-toggle" for="showInactive"
              ><span>Show inactive</span
              ><input id="showInactive" type="checkbox" /></label
            ><button class="primary-button" id="addBtn">
              + Add department
            </button>
          </div>
        </div>
        <article class="table-card">
          <div class="filter-row">
            <div class="search-box">
              <span class="material-symbols-rounded" aria-hidden="true"
                >search</span
              ><input id="search" placeholder="Search employee departments" />
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>CODE</th>
                  <th>DEPARTMENT</th>
                  <th>STATUS</th>
                  <th>MANAGE</th>
                </tr>
              </thead>
              <tbody id="body"></tbody>
            </table>
          </div>
        </article>
      </main>
    </div>
    <dialog id="dialog">
      <form id="form">
        <div class="modal-head">
          <h2>Add employee department</h2>
          <button class="close-button">×</button>
        </div>
        <div class="form-grid">
          <label class="full">Department name<input id="name" required /></label
          ><label class="full">Code<input id="code" required /></label>
        </div>
        <p id="error" class="form-error"></p>
        <div class="modal-actions">
          <button value="cancel" class="secondary-button">Cancel</button
          ><button class="primary-button">Save</button>
        </div>
      </form>
    </dialog>
    <script src="/client/shared-ui.js"></script>
    <script src="/client/maintenance/academic.js"></script>
  </body>
</html>
