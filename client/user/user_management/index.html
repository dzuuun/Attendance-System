<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>User Management — TapTrack</title>
    <link rel="stylesheet" href="/client/dashboard/style.css" />
    <link rel="stylesheet" href="/client/dashboard/events.css" />
    <link rel="stylesheet" href="/client/page-shell.css" />
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebarMount"></div>
      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">ACCESS CONTROL</p>
            <h1>User management</h1>
          </div>
          <div class="live-time">
            <span id="liveTime"></span><small id="liveDate"></small>
          </div>
        </header>
        <div class="section-header">
          <p>Create staff accounts and manage access.</p>
          <button class="primary-button" id="addBtn">+ Add user</button>
        </div>
        <article class="table-card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>USER</th>
                  <th>USERNAME</th>
                  <th>PERMISSION</th>
                  <th>STATUS</th>
                  <th>ACTIONS</th>
                </tr>
              </thead>
              <tbody id="body"></tbody>
            </table>
          </div>
        </article>
      </main>
    </div>
    <dialog id="dialog">
      <form id="form">
        <input type="hidden" id="recordId" />
        <div class="modal-head">
          <div>
            <span class="modal-kicker" id="dialogKicker">NEW RECORD</span>
            <h2 id="dialogTitle">Add user</h2>
          </div>
          <button class="close-button">×</button>
        </div>
        <div class="form-grid">
          <label>First name<input id="firstName" required /></label
          ><label>Middle name<input id="middleName" /></label
          ><label>Last name<input id="lastName" required /></label
          ><label>Username<input id="username" required /></label
          ><label class="full"
            >Institutional email (optional)<input
              id="institutionalEmail"
              type="email"
              autocomplete="email"
              placeholder="name@ndmu.edu.ph" /></label
          ><label
            >Permission<select id="role" required>
              <option value="">Select permission</option>
            </select></label
          ><label class="full"
            ><span id="passwordLabel">Temporary password</span
            ><span class="password-input-wrap"
              ><input
                id="password"
                type="password"
                minlength="8"
                required
              /><button
                type="button"
                class="password-visibility"
                id="passwordVisibility"
                aria-label="Show password"
                aria-pressed="false"
                title="Show password"
              >
                <span id="passwordVisibilityText" aria-hidden="true">SHOW</span>
              </button></span
            ></label
          >
          <label class="full" id="statusField">
            <span>Account status</span>
            <span class="account-status-control">
              <span
                ><strong class="block text-sm text-[#183128]"
                  >Active account</strong
                ><small class="font-normal text-[#65736c]"
                  >Allow this user to sign in.</small
                ></span
              >
              <input id="isActive" type="checkbox" checked />
            </span>
          </label>
        </div>
        <p id="error" class="form-error"></p>
        <div class="modal-actions">
          <button value="cancel" class="secondary-button">Cancel</button
          ><button class="primary-button" id="saveBtn">Create</button>
        </div>
      </form>
    </dialog>
    <script src="/client/shared-ui.js"></script>
    <script src="/client/user/user_management/script.js"></script>
  </body>
</html>
