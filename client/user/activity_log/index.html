<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Activity Log — TapTrack</title>
    <link rel="stylesheet" href="/client/dashboard/style.css" />
    <link rel="stylesheet" href="/client/dashboard/events.css" />
    <link rel="stylesheet" href="/client/page-shell.css" />
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebarMount"></div>
      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">USERS &amp; ACCESS</p>
            <h1>Activity log</h1>
          </div>
          <div class="live-time">
            <span id="liveTime"></span><small id="liveDate"></small>
          </div>
        </header>
        <div class="section-header">
          <p>Review user actions recorded throughout the system.</p>
        </div>
        <article class="table-card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>DATE &amp; TIME</th>
                  <th>USER</th>
                  <th>ACTION</th>
                  <th>MODULE</th>
                  <th>DETAILS</th>
                </tr>
              </thead>
              <tbody id="body"></tbody>
            </table>
          </div>
        </article>
      </main>
    </div>
    <script src="/client/shared-ui.js"></script>
    <script src="/client/user/activity_log/script.js"></script>
  </body>
</html>
