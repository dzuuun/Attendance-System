<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#123d2e" />
    <title>University Entrance — TapTrack</title>
    <link rel="stylesheet" href="/client/kiosk/style.css" />
    <link rel="stylesheet" href="/client/kiosk/last-log.css" />
    <link rel="stylesheet" href="/client/kiosk/fullscreen.css" />
    <link rel="stylesheet" href="/client/camera-scanner.css" />
  </head>
  <body>
    <main class="kiosk">
      <header>
        <a class="brand" href="/"><i>⌁</i><span>TapTrack</span></a>
        <div class="terminal-status">
          <span></span> ENTRANCE TERMINAL ONLINE
        </div>
      </header>

      <section class="terminal-card">
        <div class="intro">
          <p>UNIVERSITY ENTRANCE</p>
          <h1>Tap your ID</h1>       
          <div class="scanner-config" id="scannerConfig">
            <span>SCANNER ASSIGNMENTS</span>
            <div class="assignment-row">
              <b>Time In</b><small id="timeInDevice">Not assigned</small>
              <button type="button" data-pair="Time In">Assign</button>
            </div>
            <div class="assignment-row">
              <b>Time Out</b><small id="timeOutDevice">Not assigned</small>
              <button type="button" data-pair="Time Out">Assign</button>
            </div>
          </div>
        </div>

        <div class="scanner" id="scannerVisual">
          <div class="rings"><div class="card-icon">⌁</div></div>
          <div class="scan-beam"></div>
        </div>

        <form id="kioskForm">
          <label for="kioskInput">ID NUMBER</label>
          <div class="input-row">
            <span>⌁</span
            ><input
              id="kioskInput"
              autocomplete="off"
              placeholder="Tap card or enter ID..."
              autofocus
            /><select id="manualAction" aria-label="Manual attendance action">
              <option>Time In</option>
              <option>Time Out</option></select
            ><button>Submit →</button>
          </div>
        </form>
        <button
          type="button"
          class="camera-scan-button kiosk-camera-button"
          id="kioskCameraScan"
        >
          Scan barcode with camera
        </button>
        <div class="result" id="kioskResult" role="status" aria-live="polite">
          <span class="result-icon">⌁</span>
          <div class="result-content">
            <strong>Ready to scan</strong
            ><small id="readyMessage">Waiting for the scanner service.</small>
          </div>
        </div>
      </section>

      <footer>
        <div>
          <strong id="clock">--:--</strong
          ><span id="date">Loading date...</span>
        </div>
        <a href="/login">Staff login</a>
      </footer>
    </main>
    <script src="/client/camera-scanner.js"></script>
    <script src="/client/kiosk/script.js"></script>
    <script src="/client/brand-ui.js?v=20260824-5" data-brand-ui></script>
  </body>
</html>
